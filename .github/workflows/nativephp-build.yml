name: Build NativePHP Windows App

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, fileinfo, openssl, pdo, pdo_mysql, zip, gd, pdo_sqlite, sqlite3, curl, sockets, json, date, xml, tokenizer, session, iconv, simplexml, dom, xmlreader, xmlwriter

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: create Database
        run: |
          php artisan migrate --no-interaction --force
          
      - name: Setup Env and Database
        shell: powershell
        run: |
          Copy-Item .env.example .env
          php artisan key:generate --no-interaction
          if (-not (Test-Path "database/database.sqlite")) {
              New-Item -Path "database/database.sqlite" -ItemType "file"
          }

      - name: create Database
        run: |
          php artisan migrate --no-interaction --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NativePHP Scaffolding & Compile Plugin
        run: |
          php artisan native:install --no-interaction --force
          npm install
          npm run build
          copy vendor/nativephp/desktop/resources/electron/.env.development vendor/nativephp/desktop/resources/electron/.env.production
          copy vendor/nativephp/desktop/resources/electron/.env.development vendor/nativephp/desktop/resources/electron/.env
          npm --prefix vendor/nativephp/desktop/resources/electron run plugin:build

      - name: Build NativePHP Windows Executable
        run: php artisan native:build win x64 --no-interaction -vvv

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativePHP-Windows-EXE
          path: nativephp/electron/dist/*.exe
          retention-days: 2

  release:
    name: Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: NativePHP-Windows-EXE
          path: app-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            app-build/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
